name: Gold Equilibrium Daily Update

on:
  push:
    branches:
      - main
    paths:
      - "gold/**"
      - ".github/workflows/gold-daily-update.yml"
  schedule:
    - cron: "20 21 * * *"
  workflow_dispatch:

concurrency:
  group: gold-equilibrium-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-gold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile sources
        run: python -m compileall -q gold/src
      - name: Collect institutional point-in-time inputs
        run: python gold/src/collect_institutional_inputs.py
      - name: Research cyclical fair-value candidates
        run: python gold/src/research_cyclical_model.py
      - name: Calibrate weekly ARX fair-value model
        run: python gold/src/calibrate_gold_weekly_arx.py
      - name: Run independent strict model validation
        run: python gold/src/strict_model_validation.py
      - name: Update latest gold data
        run: python gold/src/update_gold.py
      - name: Enforce strict publication gate
        run: python gold/src/apply_publication_gate.py
      - name: Assert economic committee publication contract
        run: python gold/src/assert_publication_contract.py
      - name: Commit refreshed outputs
        run: |
          git config user.name "gold-equilibrium-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/gold/data/weekly_calibration.json docs/gold/data/latest.json docs/gold/data/institutional_inputs.json docs/gold/data/cyclical_research.json
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "chore(gold): strict-governance daily refresh"
            git pull --rebase origin main
            git push origin main
          fi
